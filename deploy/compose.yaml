# The server and the robots on one host. The robots reach the server over the compose
# network, not through the tunnel.
#
# HOST_PORT is where the server listens on the host, and only on loopback: the
# Cloudflare tunnel is the way in.
services:
  server:
    image: mpihlak/gosailing-server:${SERVER_TAG:-latest}
    restart: unless-stopped
    ports: ['127.0.0.1:${HOST_PORT:-8080}:8080']
    volumes: ['./logs:/data/logs']
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '5' }
  ai:
    image: mpihlak/gosailing-ai:${AI_TAG:-latest}
    restart: unless-stopped
    command: ['ws://server:8080', '--count', '9']
    depends_on:
      server: { condition: service_healthy }
    logging: *logging
