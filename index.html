<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2c44" />
    <title>Go Sailing</title>
    <style>
      :root {
        /* The narrow layout's budget. The layout test reads these. */
        --gauge-narrow: 68px;
        --gauge-narrow-wide: 106px;
        --gauge-gap-narrow: 4px;
        --hud-pad-narrow: 8px;
        --gauge-height-narrow: 48px;
        --standings-width: 150px;
        --tiller-height: 56px;
        --ink: #eaf2f8;
        --dim: #8aa7ba;
        --panel: rgba(8, 28, 44, 0.82);
        --edge: rgba(255, 255, 255, 0.12);
        --warn: #ffb347;
        --good: #7ee08a;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a2c44;
        color: var(--ink);
        overscroll-behavior: none;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }
      #bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
      }
      #hud {
        padding: 10px max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom));
        display: flex;
        gap: 6px;
        justify-content: center;
        flex-wrap: wrap;
        pointer-events: none;
      }
      .gauge {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 6px 8px;
        /* Fixed, not minimum: a gauge that grows with its digits shifts the whole row,
           and the telltales are lined up against the first one. */
        flex: 0 0 auto;
        width: 86px;
        text-align: center;
        backdrop-filter: blur(8px);
      }
      .gauge .label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .gauge .value {
        display: block;
        font-size: 19px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gauge .label {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gauge.wide { width: 136px; }
      [data-field='timer'] .value { font-size: 24px; }
      #standings {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        right: max(14px, env(safe-area-inset-right));
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 6px 4px;
        min-width: var(--standings-width);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }
      /* The tiller. Pull it over and she turns; let go and it comes back amidships. */
      #tiller {
        display: none;
        position: relative;
        height: var(--tiller-height);
        margin: 0 max(10px, env(safe-area-inset-left)) 6px max(10px, env(safe-area-inset-right));
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--edge);
        backdrop-filter: blur(8px);
        touch-action: none;
        user-select: none;
      }
      #tiller::before {
        content: '';
        position: absolute;
        left: calc(50% - 1px);
        top: 12px;
        bottom: 12px;
        width: 2px;
        background: rgba(255, 255, 255, 0.16);
      }
      #tiller .grip {
        position: absolute;
        top: 5px;
        bottom: 5px;
        left: calc(50% - 34px);
        width: 68px;
        border-radius: 999px;
        background: rgba(79, 163, 221, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.28);
        transition: transform 0.16s ease-out;
      }
      #tiller.holding .grip { transition: none; background: rgba(79, 163, 221, 0.66); }
      .crew {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 9px;
        font-size: 13px;
        color: var(--dim);
        white-space: nowrap;
      }
      .crew.mine { color: var(--ink); font-weight: 600; }
      .crew .pos { width: 1em; text-align: right; font-variant-numeric: tabular-nums; }
      .crew .who { flex: 1; }
      .crew.home .who::after { content: ' ✓'; color: var(--good); }
      .crew .pen { min-width: 2.5em; text-align: right; }
      .crew .turns { color: var(--warn); letter-spacing: 1px; }
      [data-banner] {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--edge);
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.25s ease;
        white-space: nowrap;
      }
      [data-banner][data-visible='true'] { opacity: 1; }
      [data-banner][data-tone='warn'] { color: var(--warn); }
      [data-banner][data-tone='good'] { color: var(--good); }
      #overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 18, 30, 0.62);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        padding: 20px;
      }
      #overlay[data-visible='true'] { opacity: 1; pointer-events: auto; cursor: pointer; }
      /* Splits the instruments into two rows where there is no room for one. */
      .row-break { display: none; }
      .card {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 16px;
        padding: 24px 28px;
        max-width: 440px;
        text-align: center;
      }
      .card h1 { margin: 0 0 10px; font-size: 22px; }
      .results {
        width: 100%;
        border-collapse: collapse;
        margin: 4px 0 16px;
        font-variant-numeric: tabular-nums;
      }
      .results td {
        padding: 7px 10px;
        border-bottom: 1px solid var(--edge);
        text-align: left;
        color: var(--dim);
      }
      .results td:first-child { width: 2em; text-align: right; }
      .results td:last-child { text-align: right; }
      .results tr:last-child td { border-bottom: none; }
      .results tr.mine td { color: var(--ink); font-weight: 600; }
      .card p { margin: 0; color: var(--dim); line-height: 1.6; font-size: 14px; }
      .card b { color: var(--ink); }
      /* A phone held upright. The instruments go on two rows: what she is doing on top,
         where the race stands underneath. */
      @media (pointer: coarse), (max-width: 560px) {
        #tiller { display: block; }
      }
      @media (max-width: 560px) {
        /* Both rows start at the same edge rather than each centring on its own. */
        #hud {
          justify-content: flex-start;
          gap: var(--gauge-gap-narrow);
          padding: var(--hud-pad-narrow) max(var(--hud-pad-narrow), env(safe-area-inset-left))
            max(10px, env(safe-area-inset-bottom));
        }
        .gauge {
          width: var(--gauge-narrow);
          min-height: var(--gauge-height-narrow);
          padding: 5px 3px;
        }
        .gauge.wide { width: var(--gauge-narrow-wide); }
        .gauge .label { font-size: 9px; letter-spacing: 0.03em; }
        .gauge .value { font-size: 15px; }
        [data-field='timer'] .value { font-size: 19px; }

        /* No room for the wind direction; the telltales and the arrows say it better. */
        [data-field='wind'] { display: none; }

        [data-field='speed'],
        [data-field='twa'],
        [data-field='tws'],
        [data-field='vmg'],
        [data-field='targetVmg'] { order: 1; }
        .row-break { display: block; order: 2; flex-basis: 100%; height: 0; }
        [data-field='timer'],
        [data-field='line'],
        [data-field='status'] { order: 3; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div data-banner data-visible="false"></div>
    <div id="standings"></div>
    <div id="bottom">
    <div id="tiller"><div class="grip"></div></div>
    <div id="hud">
      <div class="gauge" data-field="timer"><span class="label">Timer</span><span class="value">—</span></div>
      <div class="gauge" data-field="speed"><span class="label">Speed</span><span class="value">—</span></div>
      <div class="gauge" data-field="twa"><span class="label">TWA</span><span class="value">—</span></div>
      <div class="gauge" data-field="tws"><span class="label">TWS</span><span class="value">—</span></div>
      <div class="gauge" data-field="wind"><span class="label">TWD</span><span class="value">—</span></div>
      <div class="gauge" data-field="vmg"><span class="label">VMG</span><span class="value">—</span></div>
      <div class="gauge" data-field="targetVmg"><span class="label">Target VMG</span><span class="value">—</span></div>
      <div class="gauge" data-field="line"><span class="label">To line</span><span class="value">—</span></div>
      <div class="row-break"></div>
      <div class="gauge wide" data-field="status"><span class="label">Next</span><span class="value">—</span></div>
    </div>
    </div>
    <div id="overlay" data-visible="false"></div>
    <script type="module" src="/src/apps/game/main.ts"></script>
  </body>
</html>
