<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2c44" />
    <title>Go Sailing</title>
    <style>
      :root {
        /* The two corner panels are one box drawn two ways: the telltales on the canvas,
           the board in the page. The layout test checks these against the renderer. */
        --panel-width: 140px;
        --panel-height: 60px;
        /* The one-row layout's budget, and the width it stops fitting at. */
        --gauge-width: 86px;
        --timer-width: 150px;
        --gauge-gap: 6px;
        --edge-pad: 12px;
        --one-row-until: 840px;
        /* How far the telltales' left edge lies from the middle of the screen: half the
           clock, the two gauges between them, and the panel itself. The board lines up
           with it. */
        --telltales-offset: calc(
          var(--timer-width) / 2 + var(--gauge-width) * 2 + var(--gauge-gap) * 3 +
            var(--panel-width)
        );
        --standings-width: 186px;
        --standings-height: 58px;
        /* The narrow layout's budget. The layout test reads these. */
        --gauge-narrow: 64px;
        --gauge-narrow-timer: 90px;
        --gauge-gap-narrow: 4px;
        --edge-pad-narrow: 8px;
        --gauge-height-narrow: 46px;
        --standings-narrow: 176px;
        --tiller-height: 56px;
        --ink: #eaf2f8;
        --dim: #8aa7ba;
        --panel: rgba(8, 28, 44, 0.82);
        --edge: rgba(255, 255, 255, 0.12);
        --warn: #ffb347;
        --good: #7ee08a;
        --penalty: #e0564b;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a2c44;
        color: var(--ink);
        overscroll-behavior: none;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }
      /* Everything the player steers by sits at the top, in one column: the instruments
         across, and whatever the race has to say to them underneath. */
      #top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        padding: max(var(--edge-pad), env(safe-area-inset-top))
          max(var(--edge-pad), env(safe-area-inset-right)) 0
          max(var(--edge-pad), env(safe-area-inset-left));
      }
      /*
       * Three columns with the clock in the middle one, so it sits on the center line of
       * the screen whatever is beside it. The instruments close on it from both sides,
       * which keeps the telltales next to the speed rather than out at the edge.
       */
      #hud {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: start;
        gap: var(--gauge-gap);
        width: 100%;
      }
      .side {
        display: flex;
        gap: var(--gauge-gap);
        align-items: flex-start;
      }
      .side.left { justify-content: flex-end; }
      .side.right { justify-content: flex-start; }
      /* The telltales are drawn on the canvas. This reserves their place in the row and
         is what the renderer measures, so the two cannot drift apart. */
      #telltales {
        flex: 0 0 auto;
        width: var(--panel-width);
        height: var(--panel-height);
      }
      .gauge {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 6px 8px;
        /* Fixed, not minimum: a gauge that grows with its digits shifts the whole row,
           and the timer is meant to sit in the middle of the screen. */
        flex: 0 0 auto;
        width: var(--gauge-width);
        text-align: center;
        backdrop-filter: blur(8px);
      }
      .gauge .label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gauge .value {
        display: block;
        font-size: 19px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gauge.timer { width: var(--timer-width); }
      .gauge.timer .value { font-size: 34px; line-height: 1.1; }
      /* The board and, under it, the tiller. Neither is steered by, so both are out of
         the way at the foot of the screen. */
      #bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
        padding: 0 max(var(--edge-pad), env(safe-area-inset-right))
          max(var(--edge-pad), env(safe-area-inset-bottom))
          max(var(--edge-pad), env(safe-area-inset-left));
      }
      #standings {
        width: var(--standings-width);
        min-height: var(--standings-height);
        margin-left: calc(50% - var(--telltales-offset));
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 6px 4px;
        backdrop-filter: blur(8px);
      }
      #tiller {
        display: none;
        position: relative;
        height: var(--tiller-height);
        pointer-events: auto;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--edge);
        backdrop-filter: blur(8px);
        touch-action: none;
        user-select: none;
      }
      #tiller::before {
        content: '';
        position: absolute;
        left: calc(50% - 1px);
        top: 12px;
        bottom: 12px;
        width: 2px;
        background: rgba(255, 255, 255, 0.16);
      }
      #tiller .grip {
        position: absolute;
        top: 5px;
        bottom: 5px;
        left: calc(50% - 34px);
        width: 68px;
        border-radius: 999px;
        background: rgba(79, 163, 221, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.28);
        transition: transform 0.16s ease-out;
      }
      #tiller.holding .grip { transition: none; background: rgba(79, 163, 221, 0.66); }
      .crew {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 7px;
        font-size: 13px;
        color: var(--dim);
        white-space: nowrap;
      }
      .crew.mine { color: var(--ink); font-weight: 600; }
      .crew .pos { width: 1em; text-align: right; font-variant-numeric: tabular-nums; }
      .crew .who { flex: 0 0 auto; }
      .crew.home .who::after { content: ' ✓'; color: var(--good); }
      /* What she is sailing for now. Quieter than her name, which is what you look for. */
      .crew .doing {
        flex: 1;
        text-align: right;
        font-size: 11px;
        font-weight: 400;
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .crew.ocs .doing { color: var(--warn); font-weight: 600; }
      .crew .pen { min-width: 2.2em; text-align: right; }
      .crew .turns { color: var(--penalty); font-weight: 600; }
      [data-banner] {
        margin-top: 8px;
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--edge);
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.25s ease;
        white-space: nowrap;
        max-width: 92vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      [data-banner][data-visible='true'] { opacity: 1; }
      [data-banner][data-tone='warn'] { color: var(--warn); }
      [data-banner][data-tone='good'] { color: var(--good); }
      #overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 18, 30, 0.62);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        padding: 20px;
      }
      #overlay[data-visible='true'] { opacity: 1; pointer-events: auto; cursor: pointer; }
      .row-break { display: none; }
      .card {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 16px;
        padding: 24px 28px;
        max-width: 440px;
        text-align: center;
      }
      .card h1 { margin: 0 0 10px; font-size: 22px; }
      .results {
        width: 100%;
        border-collapse: collapse;
        margin: 4px 0 16px;
        font-variant-numeric: tabular-nums;
      }
      .results td {
        padding: 7px 10px;
        border-bottom: 1px solid var(--edge);
        text-align: left;
        color: var(--dim);
      }
      .results td:first-child { width: 2em; text-align: right; }
      .results td:last-child { text-align: right; }
      .results tr:last-child td { border-bottom: none; }
      .results tr.mine td { color: var(--ink); font-weight: 600; }
      .card p { margin: 0; color: var(--dim); line-height: 1.6; font-size: 14px; }
      .card b { color: var(--ink); }
      /*
       * Too narrow for the telltales to sit in the row with the instruments. Everything
       * goes back to one centered line and the telltales wrap below it, which is still
       * directly under the speed and the angle they are read with.
       */
      @media (max-width: 840px) {
        #hud {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          row-gap: 6px;
        }
        .side { display: contents; }
        [data-field='speed'] { order: 1; }
        [data-field='twa'] { order: 2; }
        .gauge.timer { order: 3; }
        [data-field='tws'] { order: 4; }
        [data-field='targetVmg'] { order: 5; }
        /* Always breaks the line, so the telltales go under the instruments at every
           width in this mode and never tack themselves onto the end of the row. */
        .row-break { display: block; flex-basis: 100%; height: 0; order: 6; }
        /* The auto margin beats the centering on that line alone, putting the telltales
           against the same edge as the board at the foot of the screen. */
        #telltales { order: 7; margin-right: auto; }
        /* No centered row to line up with any more, so the board takes the same edge. */
        #standings { margin-left: 0; }
      }
      @media (pointer: coarse), (max-width: 560px) {
        /* The tiller is under the thumb, so the board goes below it rather than above. */
        #tiller { display: block; order: 1; }
        #standings { order: 2; }
      }
      /* A phone held upright. */
      @media (max-width: 560px) {
        #top {
          padding: max(var(--edge-pad-narrow), env(safe-area-inset-top))
            max(var(--edge-pad-narrow), env(safe-area-inset-right)) 0
            max(var(--edge-pad-narrow), env(safe-area-inset-left));
        }
        #hud { gap: var(--gauge-gap-narrow); }
        #bottom {
          padding: 0 max(var(--edge-pad-narrow), env(safe-area-inset-right))
            max(var(--edge-pad-narrow), env(safe-area-inset-bottom))
            max(var(--edge-pad-narrow), env(safe-area-inset-left));
        }
        #standings { width: var(--standings-narrow); }
        .gauge {
          width: var(--gauge-narrow);
          min-height: var(--gauge-height-narrow);
          padding: 5px 3px;
        }
        .gauge .label { font-size: 9px; letter-spacing: 0.03em; }
        .gauge .value { font-size: 15px; }
        .gauge.timer { width: var(--gauge-narrow-timer); }
        .gauge.timer .value { font-size: 26px; }
        [data-banner] { font-size: 14px; padding: 7px 14px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="top">
      <div id="hud">
        <div class="side left">
          <div id="telltales"></div>
          <div class="gauge" data-field="speed"><span class="label">Speed</span><span class="value">—</span></div>
          <div class="gauge" data-field="twa"><span class="label">TWA</span><span class="value">—</span></div>
        </div>
        <div class="gauge timer" data-field="timer">
          <span class="label">Timer</span><span class="value">—</span>
        </div>
        <div class="side right">
          <div class="gauge" data-field="tws"><span class="label">TWS</span><span class="value">—</span></div>
          <div class="gauge" data-field="targetVmg"><span class="label">%VMG</span><span class="value">—</span></div>
        </div>
        <div class="row-break"></div>
      </div>
      <div data-banner data-visible="false"></div>
    </div>
    <div id="bottom">
      <div id="standings"></div>
      <div id="tiller"><div class="grip"></div></div>
    </div>
    <div id="overlay" data-visible="false"></div>
    <script type="module" src="/src/apps/game/main.ts"></script>
  </body>
</html>
